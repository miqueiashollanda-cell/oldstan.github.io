<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Old Stan Films | Produção Audiovisual nos Inhamuns</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;

            margin: 0;

        }
        header {
            padding: 60px 20px;

            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .portfolio-grid {

            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

        }
        .card {

            padding: 15px;

        }
